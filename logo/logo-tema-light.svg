<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 110" width="100%" height="100%">
  <!-- Icon Logo -->
  <g transform="translate(15, 10)">
    <!-- Grafik Batang & Garis -->
    <rect x="5" y="50" width="8" height="25" rx="2" fill="#0066FF"/>
    <rect x="18" y="37" width="8" height="38" rx="2" fill="#0066FF"/>
    <rect x="31" y="25" width="8" height="50" rx="2" fill="#0066FF"/>
    <path d="M 0 70 L 20 63 L 35 40 L 48 40" fill="none" stroke="#0066FF" stroke-width="4" stroke-linecap="round"/>
    <circle cx="48" cy="40" r="4" fill="#0066FF"/>

    <!-- Papan Ujian / Clipboard -->
    <rect x="42" y="10" width="56" height="72" rx="6" fill="#FFFFFF" stroke="#0F172A" stroke-width="4"/>
    <rect x="58" y="6" width="24" height="8" rx="3" fill="#0066FF"/>
    <circle cx="70" cy="10" r="3" fill="#FFFFFF"/>

    <!-- Garis Kertas -->
    <line x1="52" y1="25" x2="72" y2="25" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>
    <line x1="52" y1="35" x2="82" y2="35" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>

    <!-- Centang Hijau -->
    <path d="M 50 48 L 65 68 L 100 28" fill="none" stroke="#00C853" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Piksel Digital -->
    <rect x="98" y="18" width="6" height="6" rx="1" fill="#0066FF"/>
    <rect x="106" y="14" width="6" height="6" rx="1" fill="#0066FF"/>
    <rect x="106" y="22" width="6" height="6" rx="1" fill="#0066FF"/>
  </g>

  <!-- Wordmark Light Mode -->
  <text x="145" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="600">
    <tspan fill="#0F172A">Sistem </tspan>
    <tspan fill="#0066FF" font-weight="700">Rapor </tspan>
    <tspan fill="#0F172A">Digital</tspan>
  </text>
</svg>
